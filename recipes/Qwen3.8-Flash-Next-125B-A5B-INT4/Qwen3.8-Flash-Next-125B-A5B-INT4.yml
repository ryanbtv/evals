description: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound (V8, top-k 5) on a single DGX Spark / GB10 with the b12x stack
model: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
container: eugr/spark-vllm-b12x@sha256:8e7e062186f841453ef0ec6f713043c5b65447decc3835206685128c18e42262
runtime: vllm-distributed
min_sparkrun_version: "0.4.1"
max_nodes: 1
mods:
  - flashnext-int4-b12x
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.01
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 8
  pipeline_parallel: 1
  served_model_name: Qwen3.8-Flash-Next-125B-A5B-INT4
  block_size: 16
  kv_cache_dtype: auto
  kv_cache_bytes: 10g
  num_speculative_tokens: 4
  load_format: fastsafetensors
  chat_template: medium_chat_template.jinja
env:
  FLASHNEXT_SNAPSHOT: "{launch.model_path}"
  HF_HUB_OFFLINE: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_MEGA_AOT_ARTIFACT: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  B12X_POLICY_MODE: auto
  VLLM_ENABLE_ROCE_ALLREDUCE: '1'
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: 2MB
  VLLM_PLE_TABLE_MEMORY: disk
  VLLM_FP8_HYBRID: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_USE_DEEP_GEMM: '0'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_MTP_DRAFT_SCALE: '2'
command: |
  vllm serve /workspace/flashnext/model \
    --revision {model_revision} \
    --tokenizer {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --mamba-cache-mode align \
    --linear-backend b12x \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --gdn-decode-kernel b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template /workspace/flashnext/model/{chat_template} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"model":"/workspace/flashnext/draft-k10","rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
recipe_version: "2"
