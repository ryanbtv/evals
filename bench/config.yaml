# Fixed benchmark parameters. Every model runs with exactly these values.
# The recipe path given to ./bench/run is the only per-run input.
harness_version: 2

target:
  solo: true
  cluster: null          # null = sparkrun's saved default cluster
  health_timeout_s: 10   # per HTTP health probe of the reused server

# Before benchmarking, stop every other sparkrun workload and GPU container.
preflight:
  keep_containers: [caddy, bifrost, dockhand, dockhand-postgres]
  systemd_units: [dgx-model-stacks.service]   # stopped (sudo -n) if active; not restarted

performance:
  framework: llama-benchy
  bench_args:
    pp: [2048]
    tg: [128]
    # short = 65536; long = 259840. 259840 + 2048 (pp) + 128 (tg) = 262016, leaving 128
    # tokens under the 262144 window for chat-template/BOS tokens. 259968 (zero slack) was
    # used on 2026-10-25 and every measured request failed with HTTP 400 "262145 tokens".
    depth: [65536, 259840]
    concurrency: [1, 2, 4]
    runs: 3
    prefix_caching: true
  # Per (depth, concurrency) cell. The longest legitimate cell (long depth, c=4) is
  # estimated at ~8,100 s from the 2026-10-25 run (one run of 3 took ~2,705 s at 258048).
  # 14,400 s (sparkrun's default) gives ~1.8x headroom yet still bounds a hang at 4 h.
  timeout_s: 14400

tools:
  framework: tool-eval-bench
  bench_args:
    ref: v2.8.0
    trials: 3
    hardmode: true
    temperature: 0.0
  timeout_s: 21600       # whole suite

# BENCH_SMOKE=1 overlays these values. Harness validation only.
smoke:
  performance:
    bench_args: {depth: [0], concurrency: [1], runs: 1}
  tools:
    bench_args: {trials: 1, hardmode: false}
