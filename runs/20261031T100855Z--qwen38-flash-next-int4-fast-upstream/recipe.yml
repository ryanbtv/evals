description: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound (V8, top-k 5) on a single DGX Spark / GB10 with the b12x stack, int4-fast-upstream settings. Converted from azampatti/Qwen3.8-Flash-Next-Int4-FAST@f70cf7bd1ad388e516d5a8383dafe217079fcc33 qwen3.8-flash-next-int4-b12x-solo.yaml (eugr b12x 2026-10-15 build, vLLM 0.1.dev21830, MTP 5 greedy, KV 20g).
model: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
container: eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595
runtime: vllm-distributed
min_sparkrun_version: "0.4.1"
max_nodes: 1
mods:
  - flashnext-int4-b12x
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.01
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 8
  pipeline_parallel: 1
  served_model_name: Qwen3.8-Flash-Next-125B-A5B-INT4-fast-upstream
  model_revision: b880593bcec1877c57d8e62415b47858222f21fd
  block_size: 1632
  kv_cache_dtype: auto
  kv_cache_bytes: 20g
  num_speculative_tokens: 5
  load_format: fastsafetensors
  chat_template: medium_chat_template.jinja
  temperature: 0.6
  presence_penalty: 0.1
env:
  FLASHNEXT_SNAPSHOT: "{launch.model_path}"
  HF_HUB_OFFLINE: '1'
  CUTE_DSL_ARCH: sm_121a
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_MEGA_AOT_ARTIFACT: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  B12X_POLICY_MODE: auto
  VLLM_PLE_TABLE_MEMORY: disk
  VLLM_FP8_HYBRID: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_USE_DEEP_GEMM: '0'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_MTP_DRAFT_SCALE: '2'
command: |
  vllm serve /workspace/flashnext/model \
    --revision {model_revision} \
    --tokenizer {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --mamba-cache-mode align \
    --recurrent-checkpoint-policy aligned \
    --linear-backend b12x \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --gdn-decode-kernel b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --override-generation-config '{"presence_penalty":{presence_penalty},"temperature":{temperature}}' \
    --chat-template /workspace/flashnext/model/{chat_template} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":<redacted>},"model":"/workspace/flashnext/draft-k10","rejection_sample_method":"block","draft_sample_method":"greedy"}'
recipe_version: "2"
