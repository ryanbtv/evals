description: nvidia/Qwen3.8-Flash-Next-FP4-Local (modelopt_mixed NVFP4, MTP 4) on a single DGX Spark / GB10 with the b12x stack and PLE tables offloaded to disk. Converted from eugr/spark-vllm-docker recipes/qwen3.8-flash-next-nvfp4-solo.yaml.
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
container: eugr/spark-vllm-b12x@sha256:57c24fc397c66d4d28a7d0d5f1d792934fd01a70f4574cff6315fb7bc329d5cb
runtime: vllm-distributed
min_sparkrun_version: "0.4.1"
max_nodes: 1
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.8
  served_model_name: Qwen3.8-Flash-Next-FP4-Local
env:
  # Bound PyTorch CUDA reservation during A16 weight preparation on shared RAM.
  # This allocator cap is independent of vLLM's gpu_memory_utilization budget.
  PYTORCH_ALLOC_CONF: "per_process_memory_fraction:0.8"
  VLLM_PLE_TABLE_MEMORY: disk
  B12X_DISK_BACKEND: io_uring
  CUTE_DSL_ARCH: sm_121a
  SAFETENSORS_FAST_GPU: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_MEGA_AOT_ARTIFACT: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  B12X_POLICY_MODE: auto
  VLLM_MXFP8_LM_HEAD: '1'
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
  VLLM_B12X_MOE_FP4_FORCE_A16: '1'
  B12X_W4A16_A4_PREFILL: '1'
command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":<redacted>}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{"pass_config":{"fuse_act_quant":true}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
recipe_version: "2"
